name: ai-devops-demo-app CI/CD

# Thin caller — no pipeline logic lives here. All of it is in
# _reusable-ci-cd.yml; this file just says which service, which paths
# trigger it, and passes this service's inputs. A second service adds its
# own copy of this file (different name/app-path/k8s-path/image), pointed
# at the same reusable workflow — nothing here gets duplicated in the logic.

on:
  pull_request:
    branches: [develop]
    paths:
      - 'app/**'
      - 'cicd/k8s/ai-devops-demo-app/**'
  push:
    branches: [develop]
    paths:
      - 'app/**'
      - 'cicd/k8s/ai-devops-demo-app/**'
  # Manual re-run capability — e.g. re-testing a pipeline fix without
  # needing a fresh app change to push.
  workflow_dispatch: {}

concurrency:
  group: ci-cd-ai-devops-demo-app-develop
  cancel-in-progress: true

# The repo's default workflow permissions are read-only. A reusable
# workflow's jobs can never request more than this caller grants — package
# needs packages: write (push to GHCR), the deploy jobs need id-token:
# write (assume the AWS role via OIDC). Without this, GitHub refuses to
# even start the run ("Invalid workflow file"), rather than silently
# under-granting.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci-cd:
    uses: ./.github/workflows/_reusable-ci-cd.yml
    with:
      app-name: ai-devops-demo-app
      app-path: app
      k8s-path: cicd/k8s/ai-devops-demo-app
      image: ghcr.io/${{ github.repository_owner }}/ai-devops-demo-app
      deploy: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
