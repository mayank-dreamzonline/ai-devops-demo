name: ai-devops-demo-app

on:
  pull_request:
    branches: [main]
    paths: ['app/**', 'cicd/k8s/ai-devops-demo-app/**']
  push:
    branches: [main]
    paths: ['app/**', 'cicd/k8s/ai-devops-demo-app/**']
  workflow_dispatch: {}

concurrency:
  group: ci-cd-ai-devops-demo-app-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  # A reusable workflow's jobs (package needs packages:write, the deploy
  # jobs need id-token:write) can never request more than this caller
  # grants — GitHub refuses to even start the run ("Invalid workflow
  # file", zero jobs created) if this block is missing.

jobs:
  ci-cd:
    uses: ./.github/workflows/_reusable-ci-cd.yml
    with:
      app-name: ai-devops-demo-app
      app-path: app
      k8s-path: cicd/k8s/ai-devops-demo-app
      image: ghcr.io/${{ github.repository_owner }}/ai-devops-demo-app
      deploy: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
