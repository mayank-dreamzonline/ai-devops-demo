name: Reusable CI/CD

# The actual pipeline logic for one service, parameterized so any service's
# thin caller workflow can invoke it (see ai-devops-demo-app.yml for the
# only caller today — a second service adds its own caller here, not more
# logic in this file).

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
      app-path:
        type: string
        required: true
      k8s-path:
        type: string
        required: true
      image:
        type: string
        required: true
      deploy:
        description: True on merge to QA (run CD too); false on PR (CI only)
        type: boolean
        required: true

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.app-path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ inputs.app-path }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  dependency-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.app-path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --audit-level=high

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Build once, tag with the commit SHA, push, and smoke-test the exact
  # pushed artifact (brief's "integration tests" stage — spin up, hit
  # /health, tear down). This tag is what every later stage promotes
  # unchanged; nothing downstream ever rebuilds.
  package:
    if: inputs.deploy
    needs: [build-lint-test, dependency-scan, secrets-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.app-path }}
          push: true
          load: true
          tags: ${{ inputs.image }}:${{ steps.tag.outputs.sha }}
      - name: Smoke test the built image
        run: |
          docker run -d --name smoke -p 3000:3000 ${{ inputs.image }}:${{ steps.tag.outputs.sha }}
          sleep 2
          curl -sf http://localhost:3000/health
          docker rm -f smoke

  security-scan:
    if: inputs.deploy
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ inputs.image }}:${{ needs.package.outputs.image-tag }}
          severity: HIGH,CRITICAL
          exit-code: '1'

  # Automatic, no gate — matches Nana's "Core of DevOps" diagram.
  deploy-dev:
    if: inputs.deploy
    needs: package
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: aws eks update-kubeconfig --name ai-devops-demo --region us-east-1
      - uses: ./.github/actions/deploy-to-env
        with:
          environment: dev
          k8s-path: ${{ inputs.k8s-path }}
          app-name: ${{ inputs.app-name }}
          image: ${{ inputs.image }}
          image-tag: ${{ needs.package.outputs.image-tag }}

  # Bundles integration + security + acceptance + E2E into this one stage,
  # against the live dev deployment — matches the diagram's DEV-adjacent box.
  verify-dev:
    if: inputs.deploy
    needs: [package, deploy-dev]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: aws eks update-kubeconfig --name ai-devops-demo --region us-east-1
      - name: Smoke test the live dev deployment
        run: |
          kubectl port-forward -n dev svc/${{ inputs.app-name }} 8080:80 &
          sleep 3
          curl -sf http://localhost:8080/health

  # Real gate: pauses for required-reviewer approval on the "staging"
  # GitHub Environment (configured once, manually, in repo settings).
  deploy-staging:
    if: inputs.deploy
    needs: [package, verify-dev, security-scan]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: aws eks update-kubeconfig --name ai-devops-demo --region us-east-1
      - uses: ./.github/actions/deploy-to-env
        with:
          environment: staging
          k8s-path: ${{ inputs.k8s-path }}
          app-name: ${{ inputs.app-name }}
          image: ${{ inputs.image }}
          image-tag: ${{ needs.package.outputs.image-tag }}

  # Real gate: same mechanism as staging, human-triggered after staging
  # sign-off. This is Continuous Delivery, not Continuous Deployment.
  deploy-prod:
    if: inputs.deploy
    needs: [package, deploy-staging]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: aws eks update-kubeconfig --name ai-devops-demo --region us-east-1
      - uses: ./.github/actions/deploy-to-env
        with:
          environment: prod
          k8s-path: ${{ inputs.k8s-path }}
          app-name: ${{ inputs.app-name }}
          image: ${{ inputs.image }}
          image-tag: ${{ needs.package.outputs.image-tag }}
