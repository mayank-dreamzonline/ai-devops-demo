apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: ai-devops-demo-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

# The `images:` override is added here at build time by
# `kustomize edit set image` in the CI/CD workflow — always the exact same
# tag that was already deployed to dev and staging, never a rebuild.
