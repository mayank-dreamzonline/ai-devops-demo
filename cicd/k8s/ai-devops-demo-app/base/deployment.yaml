apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devops-demo-app
  labels:
    app: ai-devops-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-devops-demo-app
  template:
    metadata:
      labels:
        app: ai-devops-demo-app
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: ai-devops-demo-app
          # Overwritten per-build by `kustomize edit set image` in the CI/CD
          # workflow — this tag is a placeholder, never actually deployed.
          image: ghcr.io/mayank-dreamzonline/ai-devops-demo-app:placeholder
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
