# ClusterIP: same reasoning as terraform/app's whoami service — reachable
# inside the cluster and via `kubectl port-forward` for verification, no
# public-facing load balancer for a sample app.
apiVersion: v1
kind: Service
metadata:
  name: ai-devops-demo-app
  labels:
    app: ai-devops-demo-app
spec:
  selector:
    app: ai-devops-demo-app
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
